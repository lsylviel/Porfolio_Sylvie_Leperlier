<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Style Comics</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portfolio-container">
        <header class="portfolio-header">
            <a href="https://lsylviel.github.io/CV-Sylvie-Leperlier---Designer-D-veloppeuse-Junior/" class="back-btn">← RETOUR CV</a>
            <h1 class="name">MES RealisationS</h1>
            <div class="onomatopoeia">CLICK!</div>
        </header>

        <main class="projects-grid">
            <!-- Projet 1 -->
            <div class="project-card halftone" data-project="Projet Alpha">
                <div class="project-content">
                    <h3>PROJET ALPHA</h3>
                    <p>Design d'interface Web</p>
                </div>
            </div>

            <!-- Projet 2 -->
            <div class="project-card halftone" data-project="Projet Beta">
                <div class="project-content">
                    <h3>PROJET BETA</h3>
                    <p>Illustration Digitale</p>
                </div>
            </div>

            <!-- Projet 3 -->
            <div class="project-card halftone" data-project="Projet Gamma">
                <div class="project-content">
                    <h3>PROJET GAMMA</h3>
                    <p>Branding & Logo</p>
                </div>
            </div>
            
            <!-- Projet 4 -->
            <div class="project-card halftone" data-project="Projet Delta">
                <div class="project-content">
                    <h3>PROJET DELTA</h3>
                    <p>Développement App</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Fenêtre Modale pour les détails -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">TITRE DU PROJET</h2>
            <div class="modal-body">
                <p>Ici, tu pourras ajouter la description détaillée, des images ou un lien vers la démo.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
